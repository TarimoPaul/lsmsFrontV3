# V3 Docker-local (owner 31/10 bg): stands in for the server's main nginx. /v3 -> the V3 container (the prod
# image's own nginx.conf), /api -> the backend of the backend repo's Docker-local (deploy/local, network lsms-local).
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /v3 {
        proxy_pass http://v3:80;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # On prod the page and /api share the origin https://elikom.co.tz; here the browser is on localhost, which the
        # backend's CORS list does not hold, so the prod origin is sent instead.
        proxy_set_header Origin https://elikom.co.tz;
        proxy_read_timeout 120s;
    }

    location = / {
        return 302 /v3/;
    }
}
