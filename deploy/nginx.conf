# nginx inside the lsms-frontend-v3 image. The server's main nginx proxies
# /v3 and /v3/ here; everything else (Flutter at /, /api) never reaches this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative Location headers: we sit behind nginx + Cloudflare (https), so an
    # absolute redirect would point at http://.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /v3 {
        return 301 /v3/;
    }

    location ^~ /v3/ {
        # SPA: deep links (/v3/sales) fall back to the app shell.
        try_files $uri $uri/ /v3/index.html;

        # App shell — always revalidate so a deploy is picked up at once.
        location = /v3/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Polled by the in-app "update available" banner.
        location = /v3/version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Content-hashed build output (main-/chunk-/styles-HASH, media/*-HASH fonts).
        # A missing file is a 404, never the app shell.
        location ~ "^/v3/(?:[^/]+-[A-Z0-9]{8}\.(?:js|css)|media/.+)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Un-hashed static files copied from public/ (icons, favicon, fonts).
        location ~* \.(?:js|css|map|json|txt|png|jpe?g|gif|svg|ico|webp|ttf|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # Nothing else is served from this container.
    location / {
        return 404;
    }
}
