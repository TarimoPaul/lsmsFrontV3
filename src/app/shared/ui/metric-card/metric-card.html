<lsms-dashboard-card [icon]="icon()" [title]="title()" [accentColor]="color()" [actionIcon]="urgent() ? 'warning' : 'more_horiz'">
  @if (breakdown()?.length) {
    <div class="breakdown">
      <div class="col">
        <span class="value" [style.color]="urgent() ? color() : null" [lsmsCountUpText]="value()"></span>
        @if (subtitle()) {
          <span class="subtitle">{{ subtitle() }}</span>
        }
      </div>
      @for (b of breakdown(); track b.label) {
        <div class="col end">
          <span class="sub-label">{{ b.label }}</span>
          <span class="sub-value">{{ b.value }}</span>
        </div>
      }
    </div>
  } @else {
    <span class="value" [style.color]="urgent() ? color() : null" [lsmsCountUpText]="value()"></span>
    @if (subtitle()) {
      <span class="subtitle">{{ subtitle() }}</span>
    }
  }
</lsms-dashboard-card>
